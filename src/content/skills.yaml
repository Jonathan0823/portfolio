# Each skill is drawn as a pixel icon: `icon` is a simple-icons slug (https://simpleicons.org),
# `mono` is 1–3 letters for a monogram, `art` names a hand-drawn mark in src/lib/skill-art.ts.
# `primary: true` draws it larger. Spoken languages live in the footer.
